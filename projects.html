<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sameer | Projects</title>
<link rel="icon" type="image/png" href="assets/images/void.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/portfolio-fix.css">
<link rel="stylesheet" href="css/top-circular-nav.css">
<style>
:root{--bg:#06070c;--panel:#0d0f18;--line:#2a2e44;--text:#eef0f8;--muted:#9aa0b8;--accent:#ff3b30;--link:#8fb4ff;--tile:#141726;--strand:#8b92b5;--W:min(520px,70vw);--H:min(320px,43vw);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body.helix-projects-page{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk","Inter",system-ui,sans-serif;overflow-x:hidden}
.helix-projects-page #pages{position:relative}
.helix-projects-page .page{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always}
.helix-projects-page .stage{position:fixed;inset:0;perspective:2600px;perspective-origin:50% 40%;overflow:hidden;pointer-events:none;z-index:1}
.helix-projects-page .axis{position:fixed;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(transparent,var(--line) 20%,var(--line) 80%,transparent);opacity:.7;pointer-events:none;z-index:1}
.helix-projects-page .tilt,.helix-projects-page .helix,.helix-projects-page .tile{transform-style:preserve-3d}
.helix-projects-page .tilt{position:absolute;left:50%;top:52%;width:0;height:0;transform:rotateX(-9deg)}
.helix-projects-page .helix{position:absolute;left:0;top:0;width:0;height:0}
.helix-projects-page .dot{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--strand);opacity:.64;box-shadow:0 0 9px rgba(139,146,181,.22)}
.helix-projects-page .tile{position:absolute;width:var(--W);height:var(--H);margin:calc(var(--H)/-2) 0 0 calc(var(--W)/-2);cursor:pointer;pointer-events:auto;outline:none}
.helix-projects-page .face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:var(--tile);box-shadow:0 22px 70px rgba(0,0,0,.5)}
.helix-projects-page .face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--tile),var(--bg))}
.helix-projects-page .tile.active .face.front{border-color:var(--accent);box-shadow:0 26px 80px -28px rgba(255,59,48,.62),0 0 0 1px rgba(255,59,48,.18)}
.helix-projects-page .face img{width:100%;height:100%;object-fit:cover;display:block}
.helix-projects-page .ph{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(189,128,255,.42),transparent 55%),linear-gradient(145deg,#191426,#0a0b12 72%)}
.helix-projects-page .shade{position:absolute;inset:auto 0 0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.helix-projects-page .tag{position:absolute;left:18px;bottom:15px;z-index:2;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px #000}
.helix-projects-page .tile:focus-visible .face.front{outline:2px solid var(--link);outline-offset:4px}
.helix-projects-page .hud{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding:clamp(100px,13vh,138px) 4vw 0;pointer-events:none;z-index:3}
.helix-projects-page .head{text-align:center;transition:opacity .3s;max-width:min(780px,76vw)}
.helix-projects-page .head small{display:block;font:500 11px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--accent);margin-bottom:9px;text-transform:uppercase}
.helix-projects-page .head h1{margin:0;font-weight:700;font-size:clamp(28px,3.3vw,44px);line-height:1.08;letter-spacing:-.04em;color:#f4f6fb;text-shadow:0 4px 22px rgba(0,0,0,.65)}
.helix-projects-page .panel{position:fixed;bottom:9vh;width:min(350px,25vw);background:rgba(13,15,24,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(130,145,180,.24);border-radius:16px;padding:19px 21px;opacity:0;pointer-events:none;z-index:4;transition:opacity .36s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.helix-projects-page .panel.left{left:3vw;transform:translateX(-40px)}
.helix-projects-page .panel.right{right:3vw;transform:translateX(40px)}
.helix-projects-page.open .panel{opacity:1;transform:none;pointer-events:auto}
.helix-projects-page .panel p{margin:0 0 14px;font-size:14px;line-height:1.65;color:#d2d6e0}
.helix-projects-page .panel a{color:var(--link);font:500 12px ui-monospace,Menlo,monospace;text-decoration:none}
.helix-projects-page .panel a:hover,.helix-projects-page .panel a:focus-visible{text-decoration:underline}
.helix-projects-page .panel h2{margin:0 0 9px;font:500 10px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.helix-projects-page .cat{display:inline-block;padding:7px 12px;border:1px solid rgba(145,160,195,.28);border-radius:999px;font-weight:600;font-size:12px;margin-bottom:7px;color:#f0f2fa}
.helix-projects-page .sub{color:var(--muted);margin:0!important;font-size:12px!important}
.helix-projects-page .chips{display:flex;flex-wrap:wrap;gap:7px}
.helix-projects-page .chips span{padding:5px 9px;border:1px solid rgba(145,160,195,.25);border-radius:999px;font:500 10px ui-monospace,Menlo,monospace;color:#e9edf8}
.helix-projects-page .block+.block{margin-top:16px}
.helix-projects-page nav.project-dots{position:fixed;right:17px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;z-index:6}
.helix-projects-page nav.project-dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid #8690a9;background:transparent;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.helix-projects-page nav.project-dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.helix-projects-page nav.project-dots button:focus-visible{outline:2px solid var(--link);outline-offset:4px}
.helix-projects-page .scroll-note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;color:#727b91;font:9px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;white-space:nowrap;transition:opacity .25s}
.helix-projects-page.open .scroll-note{opacity:0}
.helix-projects-page .topnav-trigger{z-index:81}
@media(max-width:860px){
 .helix-projects-page .panel.left{left:4vw;right:4vw;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 17px);padding:14px 16px}
 .helix-projects-page .panel.right{display:none}
 .helix-projects-page .panel p{font-size:13px;margin-bottom:8px}
 .helix-projects-page .panel h2{margin-bottom:6px}
 .helix-projects-page .panel .block+.block{margin-top:10px}
 .helix-projects-page .head{max-width:86vw}
}
@media(max-width:600px){
 :root{--W:min(82vw,440px);--H:min(50vw,260px)}
 .helix-projects-page .tilt{top:48%}
 .helix-projects-page .hud{padding-top:clamp(88px,12vh,112px)}
 .helix-projects-page .head h1{font-size:clamp(24px,7vw,34px)}
 .helix-projects-page .panel.left{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
 .helix-projects-page .panel p{font-size:12px;line-height:1.45;margin-bottom:7px}
 .helix-projects-page .cat{font-size:11px;padding:5px 9px}
 .helix-projects-page .chips span{font-size:9px;padding:4px 7px}
 .helix-projects-page nav.project-dots{right:9px;gap:9px}
 .helix-projects-page nav.project-dots button{width:8px;height:8px}
 .helix-projects-page .scroll-note{bottom:7px;font-size:8px}
}
@media(prefers-reduced-motion:reduce){.helix-projects-page .panel{transition:opacity .2s}.helix-projects-page .scroll-note{display:none}}
</style>
</head>
<body class="helix-projects-page">
<button class="topnav-trigger" id="topnavTrigger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="topnavOverlay"><img src="assets/images/black%20hole.png" alt=""></button>
<div class="topnav-overlay" id="topnavOverlay" aria-hidden="true">
 <nav class="topnav-fan" id="topnavFan" aria-label="Main navigation">

   <li style="--i:0;--a:255deg"><a href="index.html"><span>0 Home</span></a></li>
   <li style="--i:1;--a:230deg"><a href="about.html"><span>1 About</span></a></li>
   <li style="--i:2;--a:205deg"><a href="experience.html"><span>2 Experience</span></a></li>
   <li style="--i:3;--a:180deg"><a href="skills.html"><span>3 Skills</span></a></li>
   <li style="--i:4;--a:155deg"><a href="projects.html"><span>4 Projects</span></a></li>
   <li style="--i:5;--a:130deg"><a href="resume.html"><span>5 Resume</span></a></li>

  </ul>
  <div class="topnav-hub"></div>
  <button class="topnav-close" id="topnavClose" type="button" aria-label="Close navigation"><img src="assets/images/black%20hole.png" alt=""></button>
 </nav>
</div>
<div id="pages" aria-hidden="true"></div>
<div class="stage" aria-hidden="true"><div class="tilt"><div class="helix" id="helix"></div></div></div>
<div class="axis" aria-hidden="true"></div>
<div class="hud"><div class="head" id="head"><small id="count"></small><h1 id="title"></h1></div></div>
<aside class="panel left" aria-live="polite"><p id="desc"></p><a id="link" href="#" target="_blank" rel="noopener">Explore repository ↗</a></aside>
<aside class="panel right">
 <div class="block"><h2>Project category</h2><div class="cat" id="cat"></div><p class="sub" id="catsub"></p></div>
 <div class="block"><h2>Technologies &amp; skills</h2><div class="chips" id="chips"></div></div>
</aside>
<nav class="project-dots" id="dots" aria-label="Projects"></nav>
<div class="scroll-note" id="scrollNote">Scroll to rotate · Select a tile for details</div>
<script>
const PROJECTS=[
 {title:"Hexapod Simulation",label:"Legged robotics",cat:"Legged robotics / simulation",sub:"Gait control and locomotion",desc:"An 18-DOF six-legged robot simulation using ROS 2 Jazzy and Gazebo Harmonic. The repository includes a tripod-gait controller, ros2_control integration, simulated LiDAR, camera and IMU, EKF state-estimation configuration, and SLAM/Nav2 launch support.",tags:["ROS 2 Jazzy","Gazebo Harmonic","18-DOF","Tripod gait","ros2_control","SLAM","Nav2"],link:"https://github.com/sam-airobotics/hexapod_simulation",img:"https://raw.githubusercontent.com/sam-airobotics/hexapod_simulation/main/assets/images/hexapod_gazebo.png"},
 {title:"AMR Simulation",label:"Mobile robotics",cat:"Simulation / autonomy",sub:"Autonomous mobile robotics",desc:"A differential-drive autonomous mobile robot built in ROS 2 and Gazebo. The simulation brings together robot description, LiDAR sensing, mapping, localization, and autonomous navigation workflows.",tags:["ROS 2","Gazebo","URDF / Xacro","LiDAR","SLAM","Nav2"],link:"https://github.com/sam-airobotics/amr-simulation",img:"https://raw.githubusercontent.com/sam-airobotics/amr-simulation/main/resources/videos/amr_sim.gif"},
 {title:"Robotic Arm Simulation",label:"Manipulation",cat:"Simulation / development",sub:"Robotic manipulation",desc:"A simulated manipulation workflow focused on robot modelling, joint motion, trajectory planning, and validating arm behaviour in a ROS visualisation and simulation pipeline.",tags:["ROS 2","MoveIt","RViz","Robot modelling","Trajectory planning"],link:"https://github.com/sam-airobotics/robotic-arm-simulation",img:"https://raw.githubusercontent.com/sam-airobotics/robotic-arm-simulation/feature/description_pkg/assets/images/robotic-arm-rviz.png"},
 {title:"F2D Studio",label:"CAD / automation",cat:"Tooling / development",sub:"CAD-to-robotics workflow automation",desc:"A Fusion 360 automation add-in intended to streamline exporting robot description packages for ROS workflows. It connects CAD assembly structure with robot-description generation to reduce repetitive setup in simulation pipelines.",tags:["Autodesk Fusion 360","Python","CAD automation","URDF","ROS 2"],link:"https://github.com/sam-airobotics/FusionToDescription",img:"https://raw.githubusercontent.com/sam-airobotics/FusionToDescription/main/resources/icons/Fusion2Description_Logo.png"},
 {title:"Cortex — Cura",label:"Assistive robotics",cat:"Concept / development",sub:"Assistive and service robotics",desc:"A hospital-assistance robot concept designed around medicine transport, barcode-based workflows, safe navigation, and human-centred interaction. The platform explores a compact mobile base with a simplified humanoid upper body.",tags:["Robot design","ROS 2","Navigation","HMI","Perception","Human-robot interaction"],link:"https://github.com/sam-airobotics/cortex",img:"https://raw.githubusercontent.com/sam-airobotics/cortex/main/assets/videos/cura.gif"},
 {title:"void_ai",label:"AI / terminal",cat:"Application project",sub:"AI tooling and voice interaction",desc:"A Python-based terminal assistant project exploring an AI-driven command-line workflow with optional voice interaction. The project brings together application logic and a lightweight developer-facing interface.",tags:["Python","AI integration","CLI","Voice interface","Git"],link:"https://github.com/sam-airobotics/void_ai",img:""}
];
const N=PROJECTS.length,STEP=360/Math.max(N,6),PITCH=85,GAP=.14,BACK=.22;
const $=id=>document.getElementById(id),helix=$("helix"),body=document.body;
const rad=Math.PI/180,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
$("pages").innerHTML=PROJECTS.map(()=>'<section class="page"></section>').join("");
let R=300,tiles=[];
PROJECTS.forEach((p,i)=>{
 const tile=document.createElement("div");tile.className="tile";tile.tabIndex=0;tile.setAttribute("role","button");tile.setAttribute("aria-label",p.title);
 const front=document.createElement("div");front.className="face front";
 if(p.img){const img=document.createElement("img");img.src=p.img;img.alt=p.title;img.loading=i<2?"eager":"lazy";img.onerror=()=>{img.remove();const ph=document.createElement("div");ph.className="ph";front.prepend(ph)};front.appendChild(img)}
 else{const ph=document.createElement("div");ph.className="ph";front.appendChild(ph)}
 const shade=document.createElement("div");shade.className="shade";front.appendChild(shade);
 const tag=document.createElement("div");tag.className="tag";tag.textContent=p.label;front.appendChild(tag);
 const back=document.createElement("div");back.className="face back";
 tile.append(front,back);tile.addEventListener("click",()=>goTo(i));tile.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();goTo(i)}});
 helix.appendChild(tile);tiles.push({el:tile,faces:[front,back]});
});
const dotEls=[];
for(let k=0;k<=N*14;k++){const d=document.createElement("i");d.className="dot";helix.appendChild(d);dotEls.push(d)}
const dots=PROJECTS.map((p,i)=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Go to "+p.title);b.addEventListener("click",()=>goTo(i));$("dots").appendChild(b);return b});
function goTo(i){i=Math.max(0,Math.min(N-1,i));window.scrollTo({top:i*innerHeight,behavior:reduce?"auto":"smooth"})}
function layout(){
 const width=tiles[0].el.offsetWidth||Math.min(520,innerWidth*.7);
 R=(width/2)/Math.tan(STEP*rad/2)*(1+GAP);
 tiles.forEach((t,i)=>t.el.style.transform="translateY("+(i*PITCH)+"px) rotateY("+(i*STEP)+"deg) translateZ("+R+"px)");
 dotEls.forEach((d,k)=>{const u=k/14-.5;d.style.transform="translateY("+(u*PITCH)+"px) rotateY("+(u*STEP)+"deg) translateZ("+R+"px)"});
}
let cur=0,shown=-1,frameId=0;
function setActive(i){
 if(i===shown)return;shown=i;const p=PROJECTS[i];
 $("title").textContent=p.title;$("count").textContent="PROJECT "+String(i+1).padStart(2,"0")+" / "+String(N).padStart(2,"0");
 $("desc").textContent=p.desc;$("link").href=p.link;
 $("cat").textContent=p.cat;$("catsub").textContent=p.sub;
 $("chips").replaceChildren(...p.tags.map(t=>{const s=document.createElement("span");s.textContent=t;return s}));
 tiles.forEach((t,k)=>t.el.classList.toggle("active",k===i));
 dots.forEach((d,k)=>d.setAttribute("aria-current",String(k===i)));
}
function frame(){
 const target=Math.max(0,Math.min(N-1,window.scrollY/Math.max(1,innerHeight)));
 cur+=(target-cur)*(reduce?1:.12);if(Math.abs(target-cur)<.0005)cur=target;
 helix.style.transform="translateZ("+(-R)+"px) translateY("+(-cur*PITCH)+"px) rotateY("+(-cur*STEP)+"deg)";
 tiles.forEach((t,i)=>{
  const a=(i-cur)*STEP*rad,f=(Math.cos(a)+1)/2,dv=Math.abs(i-cur);
  const o=(BACK+(1-BACK)*f)*Math.max(.25,1-Math.max(0,dv-2.5)*.3);
  t.faces[0].style.opacity=o.toFixed(3);t.faces[1].style.opacity=(o*.85).toFixed(3);
 });
 const near=Math.round(cur),landed=Math.abs(cur-near)<.03&&Math.abs(target-cur)<.02;
 setActive(Math.max(0,Math.min(N-1,near)));body.classList.toggle("open",landed);
 $("head").style.opacity=Math.abs(cur-near)<.3?1:.24;
 frameId=requestAnimationFrame(frame);
}
window.addEventListener("resize",layout);
window.addEventListener("keydown",e=>{
 const a=Math.max(0,Math.min(N-1,Math.round(window.scrollY/Math.max(1,innerHeight))));
 if(["ArrowDown","ArrowRight"].includes(e.key)){e.preventDefault();goTo(Math.min(N-1,a+1))}
 if(["ArrowUp","ArrowLeft"].includes(e.key)){e.preventDefault();goTo(Math.max(0,a-1))}
 if(e.key==="Escape")body.classList.remove("open");
});
layout();setActive(0);requestAnimationFrame(frame);
</script>
<script src="js/top-circular-nav.js"></script>
</body>
</html>
